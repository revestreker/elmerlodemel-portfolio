<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work - Elmer Lødemel</title>
<meta name="description" content="Selected work by Elmer Lødemel.">
<meta name="theme-color" content="#4A28E6">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-work">

<a class="skip-link" href="#projects">Skip to projects</a>

<!-- ═══════════════════════  indigo bar  ═══════════════════════ -->
<nav class="topbar" aria-label="Primary">
  <div class="topbar-inner">
    <a class="topbar-mark" href="index.html">Elmer Lødemel</a>
    <ul class="topbar-links" id="topbar-links"></ul>
  </div>
</nav>

<!-- ─────────────────────────  category header  ───────────────────────── -->
<header class="work-head" id="top">
  <div class="wrap">
    <a class="back" href="index.html">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M19 12H5m0 0 6-6m-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Elmer Lødemel</span>
    </a>

    <h1 class="work-title" id="work-title">Work</h1>

    <!-- sibling categories, so you can move between them without going back -->
    <nav class="chips" id="chips" aria-label="Categories"></nav>
  </div>
</header>

<!-- ─────────────────────────────  projects  ──────────────────────────── -->
<main class="projects" id="projects">
  <div class="wrap">
    <p class="status" id="status">Loading work…</p>
    <div id="project-list"></div>
  </div>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <p>© <span id="year">2026</span> Elmer Lødemel</p>
    <button class="to-top" id="to-top" type="button">
      Back to top
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path d="M12 20V6m0 0-6 6m6-6 6 6" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</footer>

<!-- ─────────────────────────────  lightbox  ──────────────────────────── -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lb-title" hidden>

  <header class="lb-bar">
    <div class="lb-meta">
      <h2 class="lb-title" id="lb-title"></h2>
      <p class="lb-counter" id="lb-counter"></p>
    </div>
    <button class="lb-close" id="lb-close" aria-label="Close project">Close ✕</button>
  </header>

  <div class="lb-stage">
    <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous image">‹</button>
    <figure class="lb-figure">
      <img class="lb-image" id="lb-image" alt="">
    </figure>
    <button class="lb-nav lb-next" id="lb-next" aria-label="Next image">›</button>
  </div>

  <div class="lb-strip" id="lb-strip" role="tablist" aria-label="Images in this project"></div>
</div>

<script src="data/categories.js"></script>
<script src="data/projects.js"></script>
<script src="js/main.js"></script>
</body>
</html>
